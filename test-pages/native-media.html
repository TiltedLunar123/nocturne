<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Media-query dark theme</title>
<style>
  body { background:#ffffff; color:#1f2937; font:16px/1.6 system-ui; margin:0; padding:24px; }
  .panel { background:#f8fafc; border:1px solid #e2e8f0; padding:16px; margin:12px 0; }
  @media (prefers-color-scheme: dark) {
    body { background:#101418; color:#dfe4ea; }
    .panel { background:#181d23; border-color:#2c333c; }
  }
  @media (min-width: 100px) and (prefers-color-scheme: dark) {
    h1 { color:#9fd4ff; }
  }
</style></head>
<body>
  <h1>Media-query dark theme</h1>
  <p>The dark rules exist but the browser is emulating a light preference.</p>
  <div class="panel">A panel that the dark block also restyles.</div>
  <div class="panel">Body text that has to stay readable.</div>
</body></html>
