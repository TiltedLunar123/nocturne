<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Heavy page</title>
<style>
  body { background:#ffffff; color:#1a1a1a; font:13px/1.5 system-ui; margin:0; padding:16px; }
  .row { padding:4px 8px; border-bottom:1px solid #e8e8e8; }
  .row:nth-child(odd) { background:#f6f6f6; }
  .tag { display:inline-block; padding:1px 6px; border-radius:3px; margin-right:6px; }
</style></head>
<body>
  <h1>Six thousand elements</h1>
  <div id="host"></div>
  <script>
    // Built in script so the file stays small but the DOM does not. Colours
    // vary so the deduplication has something real to collapse.
    const host = document.getElementById('host');
    const frag = document.createDocumentFragment();
    const hues = ['#e3f2fd','#fce4ec','#e8f5e9','#fff3e0','#ede7f6','#e0f7fa'];
    const inks = ['#0d47a1','#880e4f','#1b5e20','#e65100','#311b92','#006064'];
    for (let i = 0; i < 2000; i++) {
      const row = document.createElement('div');
      row.className = 'row';
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.style.background = hues[i % hues.length];
      tag.style.color = inks[i % inks.length];
      tag.textContent = 'tag ' + (i % 6);
      const text = document.createElement('span');
      text.textContent = 'Row number ' + i + ' with some body text to measure.';
      row.append(tag, text);
      frag.append(row);
    }
    host.append(frag);
  </script>
</body></html>
