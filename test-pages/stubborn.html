<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Stubborn inline styles</title>
<style>body{font:16px/1.6 system-ui;margin:0;padding:24px}</style></head>
<body style="background-color:#ffffff !important; color:#000000 !important">
  <h1 style="color:#000000 !important">Inline important everywhere</h1>
  <p style="background-color:#ffffff !important; color:#111111 !important">
    Only user-origin CSS outranks this. Author-origin important does not.
  </p>
  <div style="background-color:#f0f0f0 !important; color:#222222 !important; padding:16px; margin:12px 0">
    A panel that refuses to be restyled by an ordinary stylesheet.
  </div>
</body></html>
