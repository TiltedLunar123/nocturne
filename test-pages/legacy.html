<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Legacy hardcoded colours</title>
<style>
  body { background:#ffffff; color:#000000; font:16px/1.6 Georgia, serif; margin:0; padding:24px; }
  .box { background:#eeeeee; border:1px solid #cccccc; padding:16px; margin:12px 0; color:#222222; }
  .note { background:#fffbe6; border:1px solid #ffe58f; padding:12px; color:#614700; }
  a { color:#0645ad; }
  table { border-collapse:collapse; margin:12px 0; }
  td, th { border:1px solid #999999; padding:6px 10px; background:#fafafa; color:#111111; }
</style></head>
<body>
  <h1>A page from before anyone had a design system</h1>
  <p>No variables, no dark theme, just hex codes. <a href="#">A link.</a></p>
  <div class="box">A grey box with its own text colour.</div>
  <div class="note">A yellow warning note, which is where naive HSL inversion goes wrong.</div>
  <table><tr><th>Header</th><th>Header</th></tr><tr><td>Cell</td><td>Cell</td></tr></table>
</body></html>
